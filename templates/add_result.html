{% extends "base.html" %}
{% block content %}
<h2>Add Quiz Result</h2>
<form action="/add_result" method="post">
    <label>Student:</label>
    <select name="student_id" required>
        {% for s in students %}
        <option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }}</option>
        {% endfor %}
    </select>

    <label>Quiz:</label>
    <select name="quiz_id" required>
        {% for q in quizzes %}
        <option value="{{ q.id }}">{{ q.subject }} ({{ q.quiz_date }})</option>
        {% endfor %}
    </select>

    <input type="number" step="0.01" name="score" placeholder="Score %" required>
    <button type="submit">Add Result</button>
</form>

<h3>Results</h3>
<table>
<tr><th>ID</th><th>Student</th><th>Quiz</th><th>Score</th></tr>
{% for r in results %}
<tr><td>{{ r.id }}</td><td>{{ r.first_name }} {{ r.last_name }}</td><td>{{ r.subject }}</td><td>{{ r.score }}</td></tr>
{% endfor %}
</table>
{% endblock %}
