{% extends "base.html" %}
{% block content %}
<h2>All Quiz Results</h2>

<a href="/add_result_page">➕ Add New Result</a>

<table>
<tr><th>ID</th><th>Student</th><th>Quiz</th><th>Date</th><th>Score</th><th>Actions</th></tr>
{% for r in results %}
<tr>
    <td>{{ r.id }}</td>
    <td>{{ r.first_name }} {{ r.last_name }}</td>
    <td>{{ r.subject }}</td>
    <td>{{ r.quiz_date }}</td>
    <td>{{ r.score }}</td>
    <td>
        <a href="/edit_result/{{ r.id }}">✏️ Edit</a> |
        <a href="/delete_result/{{ r.id }}" onclick="return confirm('Delete this result?');">🗑️ Delete</a>
    </td>
</tr>
{% endfor %}
</table>
{% endblock %}
